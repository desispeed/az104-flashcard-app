# XcodeGen spec. With XcodeGen installed (`brew install xcodegen`), run
#   cd container-monitor/ios && xcodegen generate
# to produce ContainerStatus.xcodeproj, then open it in Xcode.
name: ContainerStatus
options:
  bundleIdPrefix: com.containerstatus
  deploymentTarget:
    iOS: "17.0"
targets:
  ContainerStatus:
    type: application
    platform: iOS
    sources:
      - ContainerStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.containerstatus.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
