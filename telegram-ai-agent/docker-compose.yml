services:
  telegram-agent:
    build: .
    container_name: telegram-ai-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./memory:/app/memory
      - ./skills:/app/skills
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Drop all capabilities except what's minimally needed
    cap_drop:
      - ALL
    # No privilege escalation
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem — only memory/ and skills/ are writable via volumes
    read_only: true
    tmpfs:
      - /tmp:size=50M
